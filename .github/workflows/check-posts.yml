# Checks Reddit for new posts every 30 minutes and saves the matches to posts.json.
name: Check for new posts

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: check-posts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the Reddit feeds
        run: python fetch_posts.py posts.json
      - name: Save new matches
        run: |
          if ! git diff --quiet posts.json; then
            git config user.name "buyer-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "New posts"
            git push
          fi
